services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    environment:
      # The web page is plain HTTP on the LAN
      - INSECURE=true
      - DISABLE_IPV6=true
    volumes:
      - ./data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      # Web page and metrics on elara's own address only
      - "10.0.1.20:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      wg:
        ipv4_address: 10.42.42.42

networks:
  wg:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.42.0/24
