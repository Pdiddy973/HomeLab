# Homepage services for the Home Lab, served from callisto (10.0.30.21:3000).
# Secrets come from HOMEPAGE_VAR_* in homepage.env.
# A bookmark page with a few stats: only Home Assistant, the server rack UPS, Proxmox, TrueNAS and Plex show widgets.

# Home Assistant: the monitoring hub
- Home Assistant:
    - Home Assistant:
        icon: home-assistant.png
        href: https://homeassistant.remoteproxy.tech
        description: phobos · VM 130 · monitoring and alerts hub
        siteMonitor: http://10.0.30.30
        # Moves to saturn: change proxmoxNode when VM 130 migrates
        proxmoxNode: jupiter
        proxmoxVMID: 130
        showStats: true
        widget:
          type: homeassistant
          url: http://10.0.30.30
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - state: zone.home
              label: people home
            - state: sensor.system_homepage_lights_on
              label: lights on
            - state: sensor.system_homepage_updates_pending
              label: updates
            - state: sensor.services_homepage_monitors_down
              label: monitors down

    - Server Rack UPS:
        icon: nut.png
        href: https://homeassistant.remoteproxy.tech
        description: CyberPower CP1500 · NUT on jupiter, via HA
        widget:
          type: homeassistant
          url: http://10.0.30.30
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - state: sensor.servers_rack_ups_status
              label: status
              value: "{state}"
            - state: sensor.servers_rack_ups_battery_charge
              label: battery
            - state: sensor.servers_rack_ups_battery_runtime_minutes
              label: runtime
            - state: sensor.servers_rack_ups_load
              label: load

    - Storage and Backups:
        icon: truenas-scale.png
        href: https://homeassistant.remoteproxy.tech
        description: Pool health and last Proxmox backup, via HA
        widget:
          type: homeassistant
          url: http://10.0.30.30
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - template: "{{ 'healthy' if is_state('binary_sensor.servers_truenas_pools_hdd_pool_healthy','on') and is_state('binary_sensor.servers_truenas_pools_ssd_pool_healthy','on') and is_state('binary_sensor.servers_truenas_pools_boot_pool_healthy','on') and is_state('binary_sensor.servers_truenas_disk_pool_issues','off') else 'CHECK' }}"
              label: pools
            - state: sensor.servers_truenas_pools_hdd_pool_usage
              label: hdd used
            - template: "{{ relative_time(states('sensor.servers_jupiter_last_backup') | as_datetime) }} ago"
              label: last backup
            - template: "{{ 'failed' if is_state('binary_sensor.servers_jupiter_backup_status','on') else 'ok' }}"
              label: backup

# Proxmox host, NAS, and the network
- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: https://10.0.1.10:8006
        description: jupiter · reached from callisto at 10.0.30.5
        siteMonitor: https://10.0.30.5:8006
        widget:
          type: proxmox
          url: https://10.0.30.5:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: CHANGE_ME
          node: jupiter

    - TrueNAS:
        icon: truenas-scale.png
        href: https://10.0.1.11
        description: ganymede · VM 100
        siteMonitor: https://10.0.1.11
        widget:
          type: truenas
          url: https://10.0.1.11
          key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
          version: 2
          enablePools: true

    - Jupiter BMC:
        icon: asrock-rack.png
        href: https://10.0.1.9
        description: jupiter-bmc · remote console (Trusted only)

    - Dockhand:
        icon: dockhand.png
        href: http://10.0.30.21:3100
        description: Containers on callisto, europa and juno
        server: callisto
        container: dockhand
        showStats: true

